[project]
name = "blackscholes"
version = "0.1.0"
description = "Black-Scholes pricing and Greeks, written from scratch."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
blackscholes = "blackscholes.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["blackscholes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
