<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Black-Scholes</title>
<meta name="description" content="Price European options and see the Greeks update live.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>σ</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#fafafa;--surface:#ffffff;--line:#e5e5e5;--line-strong:#d4d4d4;
  --text:#0a0a0a;--text-2:#525252;--text-3:#8a8a8a;
  --accent:#0a0a0a;--accent-ink:#ffffff;
  --series:#2a78d6;--series-soft:rgba(42,120,214,.10);
  --pos:#008300;--neg:#e34948;
  --radius:12px;--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px -12px rgba(0,0,0,.12);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#000000;--surface:#0a0a0a;--line:#1f1f1f;--line-strong:#2e2e2e;
  --text:#ededed;--text-2:#a1a1a1;--text-3:#6b6b6b;
  --accent:#ededed;--accent-ink:#0a0a0a;
  --series:#3987e5;--series-soft:rgba(57,135,229,.14);
  --pos:#3ddc84;--neg:#e66767;
  --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#000000;--surface:#0a0a0a;--line:#1f1f1f;--line-strong:#2e2e2e;
  --text:#ededed;--text-2:#a1a1a1;--text-3:#6b6b6b;
  --accent:#ededed;--accent-ink:#0a0a0a;
  --series:#3987e5;--series-soft:rgba(57,135,229,.14);
  --pos:#3ddc84;--neg:#e66767;
  --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
.mono{font-family:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
header{display:flex;align-items:center;justify-content:space-between;height:56px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.brand span.dot{width:8px;height:8px;border-radius:50%;background:var(--series)}
.seg{display:inline-flex;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;color:var(--text-2);padding:5px 14px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.icon-btn{border:1px solid var(--line);background:var(--surface);color:var(--text-2);width:34px;height:34px;border-radius:8px;cursor:pointer;display:grid;place-items:center}
.icon-btn:hover{color:var(--text)}
.hero{padding:56px 0 32px}
.hero h1{font-size:clamp(28px,4vw,40px);font-weight:600;letter-spacing:-.03em;margin:0 0 8px;line-height:1.1}
.hero p{margin:0;color:var(--text-2);max-width:56ch}
.grid{display:grid;grid-template-columns:320px 1fr;gap:20px;padding-bottom:80px}
@media (max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.panel{padding:20px}
.field{padding:12px 0;border-bottom:1px solid var(--line)}
.field:last-child{border-bottom:0;padding-bottom:0}
.field .row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.field label{font-size:13px;color:var(--text-2);font-weight:500}
.field .num{display:inline-flex;align-items:baseline}
.field .num em{font-style:normal;color:var(--text-3);font-size:13px}
.field input[type=number]{width:84px;text-align:right;border:1px solid transparent;background:transparent;color:var(--text);font:inherit;font-size:14px;padding:2px 3px 2px 6px;border-radius:6px;outline:0}
.field input[type=number]:hover{border-color:var(--line)}
.field input[type=number]:focus{border-color:var(--line-strong);background:var(--bg)}
input[type=range]{width:100%;appearance:none;height:4px;background:var(--line-strong);border-radius:2px;outline:0;margin:6px 0 0}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:var(--surface);border:1.5px solid var(--text);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.15)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:var(--surface);border:1.5px solid var(--text);cursor:pointer}
.right{display:flex;flex-direction:column;gap:20px;min-width:0}
.price{padding:24px 24px 20px;display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:16px}
.price .label{font-size:13px;color:var(--text-2);font-weight:500;margin-bottom:6px}
.price .value{font-size:clamp(40px,6vw,56px);font-weight:500;letter-spacing:-.04em;line-height:1}
.price .sub{color:var(--text-3);font-size:13px;margin-top:8px}
.price .sub b{color:var(--text-2);font-weight:500}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border-radius:var(--radius);overflow:hidden;border:1px solid var(--line)}
@media (max-width:640px){.tiles{grid-template-columns:repeat(2,1fr)}.tiles .tile:last-child{grid-column:span 2}}
.tile{background:var(--surface);padding:16px 18px;cursor:pointer;border:0;text-align:left;font:inherit;color:inherit;position:relative}
.tile:hover{background:var(--bg)}
.tile[aria-pressed="true"]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--series)}
.tile .k{font-size:12px;color:var(--text-2);font-weight:500;display:flex;gap:6px;align-items:baseline}
.tile .k i{font-style:normal;color:var(--text-3);font-family:"JetBrains Mono",monospace;font-size:11px}
.tile .v{font-size:20px;font-weight:500;letter-spacing:-.02em;margin-top:6px}
.chart{padding:20px 20px 12px}
.chart .head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:6px}
.chart .title{font-weight:500;font-size:14px}
.chart .title span{color:var(--text-3);font-weight:400}
.chart svg{width:100%;height:300px;display:block;overflow:visible}
.axis text{fill:var(--text-3);font-size:11px;font-family:"JetBrains Mono",monospace}
.axis line{stroke:var(--line)}
.axis .base{stroke:var(--line-strong)}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;opacity:0;transition:opacity .08s;transform:translate(-50%,calc(-100% - 12px))}
.tip .t{color:var(--text-3)}
.tip .n{font-weight:500}
.chart-wrap{position:relative}
footer{border-top:1px solid var(--line);padding:20px 0;color:var(--text-3);font-size:13px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
footer a{color:var(--text-2);text-decoration:none}
footer a:hover{color:var(--text)}
.hint{font-size:12px;color:var(--text-3);margin-top:14px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="dot"></span>Black-Scholes</div>
    <div style="display:flex;gap:10px;align-items:center">
      <div class="seg" role="group" aria-label="Option type">
        <button id="kind-call" aria-pressed="true">Call</button>
        <button id="kind-put" aria-pressed="false">Put</button>
      </div>
      <button class="icon-btn" id="theme" aria-label="Toggle theme">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <section class="hero">
    <h1>Price an option. Watch the Greeks move.</h1>
    <p>Closed-form Black-Scholes for European calls and puts, with delta, gamma, theta, vega and rho computed analytically. Drag anything on the left.</p>
  </section>

  <main class="grid">
    <aside class="card panel" id="inputs"></aside>

    <div class="right">
      <div class="card price">
        <div>
          <div class="label" id="price-label">Call price</div>
          <div class="value mono" id="price">—</div>
          <div class="sub" id="price-sub"></div>
        </div>
        <div class="sub" style="text-align:right">
          <div>d₁ <b class="mono" id="d1">—</b></div>
          <div>d₂ <b class="mono" id="d2">—</b></div>
        </div>
      </div>

      <div class="tiles" id="tiles"></div>

      <div class="card chart">
        <div class="head">
          <div class="title" id="chart-title"></div>
          <div class="seg" role="group" aria-label="X axis">
            <button data-x="spot" aria-pressed="true">vs spot</button>
            <button data-x="time" aria-pressed="false">vs time</button>
            <button data-x="vol" aria-pressed="false">vs vol</button>
          </div>
        </div>
        <div class="chart-wrap">
          <svg id="svg" role="img" aria-label="Curve"></svg>
          <div class="tip" id="tip"></div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <span>Theta is quoted per day. Vega and rho are per 1% move.</span>
    <a href="https://github.com/michae6345-crypto/black-scholes-calculator">Source</a>
  </footer>
</div>

<script>
const SQRT2 = Math.SQRT2, SQRT2PI = Math.sqrt(2 * Math.PI);

function erf(x) {
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  const t = 1 / (1 + 0.5 * x);
  const y = 1 - t * Math.exp(-x * x - 1.26551223 + t * (1.00002368 + t * (0.37409196 + t * (0.09678418 +
    t * (-0.18628806 + t * (0.27886807 + t * (-1.13520398 + t * (1.48851587 + t * (-0.82215223 + t * 0.17087277)))))))));
  return s * y;
}
const pdf = x => Math.exp(-0.5 * x * x) / SQRT2PI;
const cdf = x => 0.5 * (1 + erf(x / SQRT2));

function bs(o, kind) {
  const { S, K, r, v, T, q } = o;
  const dq = Math.exp(-q * T), dr = Math.exp(-r * T);
  if (T <= 0 || v <= 0) {
    const fwd = S * dq - K * dr;
    const p = kind === 'call' ? Math.max(fwd, 0) : Math.max(-fwd, 0);
    return { price: p, d1: NaN, d2: NaN, delta: NaN, gamma: NaN, theta: NaN, vega: NaN, rho: NaN };
  }
  const sq = v * Math.sqrt(T);
  const d1 = (Math.log(S / K) + (r - q + 0.5 * v * v) * T) / sq, d2 = d1 - sq;
  const n1 = pdf(d1);
  const call = kind === 'call';
  const price = call ? S * dq * cdf(d1) - K * dr * cdf(d2) : K * dr * cdf(-d2) - S * dq * cdf(-d1);
  const delta = call ? dq * cdf(d1) : dq * (cdf(d1) - 1);
  const gamma = dq * n1 / (S * sq);
  const vega = S * dq * n1 * Math.sqrt(T);
  const decay = -S * dq * n1 * v / (2 * Math.sqrt(T));
  const theta = call ? decay - r * K * dr * cdf(d2) + q * S * dq * cdf(d1)
                     : decay + r * K * dr * cdf(-d2) - q * S * dq * cdf(-d1);
  const rho = call ? K * T * dr * cdf(d2) : -K * T * dr * cdf(-d2);
  return { price, d1, d2, delta, gamma, theta, vega, rho };
}

const FIELDS = [
  { id: 'S', label: 'Spot', min: 1, max: 500, step: 0.5, value: 100, fmt: v => v.toFixed(2) },
  { id: 'K', label: 'Strike', min: 1, max: 500, step: 0.5, value: 100, fmt: v => v.toFixed(2) },
  { id: 'T', label: 'Time to expiry (years)', min: 0, max: 5, step: 0.01, value: 1, fmt: v => v.toFixed(2) },
  { id: 'v', label: 'Volatility', min: 0, max: 2, step: 0.005, value: 0.2, fmt: v => (v * 100).toFixed(1) + '%', pct: true },
  { id: 'r', label: 'Risk-free rate', min: -0.05, max: 0.25, step: 0.0025, value: 0.05, fmt: v => (v * 100).toFixed(2) + '%', pct: true },
  { id: 'q', label: 'Dividend yield', min: 0, max: 0.2, step: 0.0025, value: 0, fmt: v => (v * 100).toFixed(2) + '%', pct: true },
];
const GREEKS = [
  { id: 'delta', sym: 'Δ', label: 'Delta', scale: 1, digits: 4 },
  { id: 'gamma', sym: 'Γ', label: 'Gamma', scale: 1, digits: 4 },
  { id: 'theta', sym: 'Θ', label: 'Theta', scale: 1 / 365, digits: 4 },
  { id: 'vega',  sym: 'ν', label: 'Vega',  scale: 0.01, digits: 4 },
  { id: 'rho',   sym: 'ρ', label: 'Rho',   scale: 0.01, digits: 4 },
];

const state = { kind: 'call', metric: 'price', xaxis: 'spot', o: Object.fromEntries(FIELDS.map(f => [f.id, f.value])) };

const $ = id => document.getElementById(id);
const inputs = $('inputs');
FIELDS.forEach(f => {
  const el = document.createElement('div');
  el.className = 'field';
  const shown = f.pct ? (f.value * 100) : f.value;
  el.innerHTML = `
    <div class="row"><label for="n-${f.id}">${f.label}</label>
      <span class="num"><input class="mono" id="n-${f.id}" type="number" step="${f.pct ? f.step * 100 : f.step}" value="${shown}">${f.pct ? '<em>%</em>' : ''}</span></div>
    <input id="s-${f.id}" type="range" min="${f.min}" max="${f.max}" step="${f.step}" value="${f.value}" aria-label="${f.label}">`;
  inputs.appendChild(el);
  const num = el.querySelector('input[type=number]'), rng = el.querySelector('input[type=range]');
  rng.addEventListener('input', () => { state.o[f.id] = +rng.value; num.value = f.pct ? +(rng.value * 100).toFixed(3) : rng.value; render(); });
  num.addEventListener('input', () => {
    const raw = parseFloat(num.value); if (Number.isNaN(raw)) return;
    const val = f.pct ? raw / 100 : raw;
    state.o[f.id] = val; rng.value = val; render();
  });
});
const hint = document.createElement('div'); hint.className = 'hint';
hint.textContent = 'Type a value or drag the slider. Everything recomputes as you go.';
inputs.appendChild(hint);

const tiles = $('tiles');
GREEKS.forEach(g => {
  const b = document.createElement('button');
  b.className = 'tile'; b.dataset.metric = g.id; b.setAttribute('aria-pressed', 'false');
  b.innerHTML = `<div class="k">${g.label}<i>${g.sym}</i></div><div class="v mono" id="g-${g.id}">—</div>`;
  b.addEventListener('click', () => { state.metric = state.metric === g.id ? 'price' : g.id; render(); });
  tiles.appendChild(b);
});

$('kind-call').onclick = () => { state.kind = 'call'; render(); };
$('kind-put').onclick = () => { state.kind = 'put'; render(); };
document.querySelectorAll('[data-x]').forEach(b => b.onclick = () => { state.xaxis = b.dataset.x; render(); });

$('theme').onclick = () => {
  const root = document.documentElement;
  const dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = dark ? 'light' : 'dark';
  try { localStorage.setItem('theme', root.dataset.theme); } catch {}
  render();
};
try { const t = localStorage.getItem('theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

const fmt = (x, d = 4) => Number.isFinite(x) ? x.toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d }) : '—';

function metricValue(res, id) {
  if (id === 'price') return res.price;
  const g = GREEKS.find(g => g.id === id);
  return res[id] * g.scale;
}

function render() {
  const { o, kind } = state;
  const res = bs(o, kind);
  $('kind-call').setAttribute('aria-pressed', kind === 'call');
  $('kind-put').setAttribute('aria-pressed', kind === 'put');
  $('price-label').textContent = (kind === 'call' ? 'Call' : 'Put') + ' price';
  $('price').textContent = fmt(res.price, 4);
  const intrinsic = kind === 'call' ? Math.max(o.S - o.K, 0) : Math.max(o.K - o.S, 0);
  $('price-sub').innerHTML = `intrinsic <b class="mono">${fmt(intrinsic, 2)}</b> · time value <b class="mono">${fmt(res.price - intrinsic, 2)}</b>`;
  $('d1').textContent = fmt(res.d1, 4); $('d2').textContent = fmt(res.d2, 4);
  GREEKS.forEach(g => {
    $('g-' + g.id).textContent = fmt(res[g.id] * g.scale, g.digits);
    tiles.querySelector(`[data-metric=${g.id}]`).setAttribute('aria-pressed', state.metric === g.id);
  });
  document.querySelectorAll('[data-x]').forEach(b => b.setAttribute('aria-pressed', b.dataset.x === state.xaxis));
  drawChart(res);
}

const XAXES = {
  spot: { key: 'S', label: 'spot', range: o => [Math.max(0.3 * o.K, 1), 1.8 * o.K], fmt: v => v.toFixed(0) },
  time: { key: 'T', label: 'time to expiry', range: () => [0.01, 3], fmt: v => v.toFixed(2) + 'y' },
  vol:  { key: 'v', label: 'volatility', range: () => [0.01, 1.2], fmt: v => (v * 100).toFixed(0) + '%' },
};

function drawChart(current) {
  const svg = $('svg');
  const ax = XAXES[state.xaxis];
  const metricLabel = state.metric === 'price' ? 'Price' : GREEKS.find(g => g.id === state.metric).label;
  $('chart-title').innerHTML = `${metricLabel} <span>vs ${ax.label}</span>`;

  const W = svg.clientWidth || 700, H = 300, m = { t: 16, r: 12, b: 28, l: 52 };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const [x0, x1] = ax.range(state.o);
  const N = 160, pts = [];
  for (let i = 0; i <= N; i++) {
    const x = x0 + (x1 - x0) * i / N;
    const y = metricValue(bs({ ...state.o, [ax.key]: x }, state.kind), state.metric);
    if (Number.isFinite(y)) pts.push([x, y]);
  }
  let ymin = Math.min(0, ...pts.map(p => p[1])), ymax = Math.max(0, ...pts.map(p => p[1]));
  if (ymax - ymin < 1e-9) { ymax += 1; ymin -= 1; }
  const pad = (ymax - ymin) * 0.08; ymin -= pad; ymax += pad;
  const sx = x => m.l + (x - x0) / (x1 - x0) * iw;
  const sy = y => m.t + (ymax - y) / (ymax - ymin) * ih;

  const yt = ticks(ymin, ymax, 5), xt = ticks(x0, x1, 6);
  const line = pts.map((p, i) => (i ? 'L' : 'M') + sx(p[0]).toFixed(1) + ' ' + sy(p[1]).toFixed(1)).join('');
  const area = line + `L${sx(pts[pts.length - 1][0]).toFixed(1)} ${sy(0)}L${sx(pts[0][0]).toFixed(1)} ${sy(0)}Z`;
  const cx = state.o[ax.key], cy = metricValue(current, state.metric);

  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.innerHTML = `
    <g class="axis">
      ${yt.map(t => `<line x1="${m.l}" x2="${W - m.r}" y1="${sy(t)}" y2="${sy(t)}"/><text x="${m.l - 8}" y="${sy(t)}" dy="4" text-anchor="end">${short(t)}</text>`).join('')}
      <line class="base" x1="${m.l}" x2="${W - m.r}" y1="${sy(0)}" y2="${sy(0)}"/>
      ${xt.map(t => `<text x="${sx(t)}" y="${H - 8}" text-anchor="middle">${ax.fmt(t)}</text>`).join('')}
    </g>
    <path d="${area}" fill="var(--series-soft)"/>
    <path d="${line}" fill="none" stroke="var(--series)" stroke-width="2" stroke-linejoin="round"/>
    ${Number.isFinite(cy) && cx >= x0 && cx <= x1 ? `<line x1="${sx(cx)}" x2="${sx(cx)}" y1="${m.t}" y2="${m.t + ih}" stroke="var(--line-strong)" stroke-dasharray="3 3"/>
      <circle cx="${sx(cx)}" cy="${sy(cy)}" r="5" fill="var(--series)" stroke="var(--surface)" stroke-width="2"/>` : ''}
    <g id="hover" style="display:none"><line y1="${m.t}" y2="${m.t + ih}" stroke="var(--text-3)"/><circle r="4" fill="var(--surface)" stroke="var(--series)" stroke-width="2"/></g>
    <rect x="${m.l}" y="${m.t}" width="${iw}" height="${ih}" fill="transparent" id="hit"/>`;

  const hover = svg.querySelector('#hover'), tip = $('tip'), hit = svg.querySelector('#hit');
  hit.onmousemove = e => {
    const r = svg.getBoundingClientRect();
    const px = (e.clientX - r.left) * W / r.width;
    const x = x0 + (px - m.l) / iw * (x1 - x0);
    const y = metricValue(bs({ ...state.o, [ax.key]: x }, state.kind), state.metric);
    hover.style.display = ''; hover.querySelector('line').setAttribute('x1', sx(x)); hover.querySelector('line').setAttribute('x2', sx(x));
    const c = hover.querySelector('circle'); c.setAttribute('cx', sx(x)); c.setAttribute('cy', sy(y));
    tip.style.opacity = 1; tip.style.left = (sx(x) * r.width / W) + 'px'; tip.style.top = (sy(y) * r.height / H) + 'px';
    tip.innerHTML = `<div class="t">${ax.label} ${ax.fmt(x)}</div><div class="n mono">${metricLabel.toLowerCase()} ${fmt(y, 4)}</div>`;
  };
  hit.onmouseleave = () => { hover.style.display = 'none'; tip.style.opacity = 0; };
}

function ticks(a, b, n) {
  const span = b - a, raw = span / n, mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const step = [1, 2, 5, 10].map(k => k * mag).find(s => span / s <= n) || mag;
  const out = []; for (let v = Math.ceil(a / step) * step; v <= b + 1e-9; v += step) out.push(+v.toFixed(10));
  return out;
}
function short(v) { const a = Math.abs(v); return a >= 100 ? v.toFixed(0) : a >= 1 ? v.toFixed(1) : a === 0 ? '0' : v.toPrecision(2); }

addEventListener('resize', () => render());
